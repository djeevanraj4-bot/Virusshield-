name: Build Virus Shield V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/virusshield
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "VirusShieldV2"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.virusshield"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.virusshield"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <application android:theme="@style/AppTheme" android:label="Virus Shield" android:allowBackup="false">
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
          <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#1976D2</item>
              <item name="android:statusBarColor">#0D47A1</item>
              <item name="android:navigationBarColor">#F4F7FB</item>
          </style>
          </resources>
          EOF

          cat > app/src/main/java/com/example/virusshield/MainActivity.kt <<'EOF'
          package com.example.virusshield

          import android.app.Activity
          import android.os.Bundle
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.View
          import android.view.animation.AlphaAnimation
          import android.widget.*
          import java.util.concurrent.Executors

          data class AppRisk(val name: String, val risk: String, val details: String)

          class MainActivity : Activity() {
              private lateinit var scoreText: TextView
              private lateinit var statusText: TextView
              private lateinit var progress: ProgressBar
              private lateinit var scanButton: Button
              private lateinit var resultsBox: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  buildUi()
              }

              private fun tv(text: String, size: Float, bold: Boolean = false) =
                  TextView(this).apply {
                      this.text = text
                      textSize = size
                      setTextColor(Color.rgb(30, 45, 65))
                      if (bold) setTypeface(null, Typeface.BOLD)
                      setPadding(0, 8, 0, 8)
                  }

              private fun buildUi() {
                  val scroll = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(28, 22, 28, 28)
                      setBackgroundColor(Color.rgb(244,247,251))
                  }

                  val header = tv("🛡️  Virus Shield", 28f, true)
                  header.setTextColor(Color.rgb(13,71,161))
                  root.addView(header)
                  root.addView(tv("Your simple mobile security dashboard", 15f))

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(24, 24, 24, 24)
                      setBackgroundColor(Color.WHITE)
                  }

                  scoreText = tv("—", 54f, true).apply {
                      gravity = Gravity.CENTER
                      setTextColor(Color.rgb(13,71,161))
                  }
                  statusText = tv("Ready for a security scan", 17f, true).apply {
                      gravity = Gravity.CENTER
                  }
                  progress = ProgressBar(this).apply { isIndeterminate = true; visibility = View.GONE }
                  scanButton = Button(this).apply {
                      text = "SCAN NOW"
                      textSize = 17f
                      setOnClickListener { scan() }
                  }

                  card.addView(scoreText)
                  card.addView(statusText)
                  card.addView(progress)
                  card.addView(scanButton)
                  root.addView(card)

                  root.addView(tv("App-by-app results", 21f, true).apply {
                      setPadding(0, 28, 0, 10)
                  })

                  resultsBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(resultsBox)

                  root.addView(tv(
                      "Note: This is a permission-risk scanner, not a guaranteed malware detector.",
                      13f
                  ))

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun scan() {
                  scanButton.isEnabled = false
                  progress.visibility = View.VISIBLE
                  scoreText.text = "…"
                  statusText.text = "Scanning your apps…"
                  resultsBox.removeAllViews()

                  Executors.newSingleThreadExecutor().execute {
                      val pm = packageManager
                      val apps = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                          .filter { (it.flags and ApplicationInfo.FLAG_SYSTEM) == 0 }

                      val results = mutableListOf<AppRisk>()
                      var points = 0

                      apps.forEach { app ->
                          val permissions = try {
                              pm.getPackageInfo(app.packageName, PackageManager.GET_PERMISSIONS)
                                  .requestedPermissions?.toList() ?: emptyList()
                          } catch (_: Exception) { emptyList() }

                          val sensitive = permissions.count {
                              it.contains("SMS", true) ||
                              it.contains("CALL_LOG", true) ||
                              it.contains("RECORD_AUDIO", true) ||
                              it.contains("REQUEST_INSTALL_PACKAGES", true) ||
                              it.contains("SYSTEM_ALERT_WINDOW", true) ||
                              it.contains("ACCESS_FINE_LOCATION", true) ||
                              it.contains("READ_CONTACTS", true)
                          }

                          val risk = when {
                              sensitive >= 4 -> "HIGH"
                              sensitive >= 2 -> "MEDIUM"
                              else -> "LOW"
                          }

                          if (risk == "HIGH") points += 5
                          else if (risk == "MEDIUM") points += 2

                          val label = pm.getApplicationLabel(app).toString()
                          results.add(AppRisk(label, risk, "$sensitive sensitive permission(s) detected"))
                      }

                      val score = (100 - points).coerceIn(0, 100)
                      results.sortByDescending {
                          if (it.risk == "HIGH") 3 else if (it.risk == "MEDIUM") 2 else 1
                      }

                      runOnUiThread {
                          progress.visibility = View.GONE
                          scoreText.text = "$score/100"
                          statusText.text = when {
                              score >= 90 -> "✅ Your device looks good"
                              score >= 70 -> "⚠️ Some apps need review"
                              else -> "🚨 Several apps need review"
                          }

                          results.take(40).forEach { addResult(it) }
                          scanButton.isEnabled = true
                      }
                  }
              }

              private fun addResult(item: AppRisk) {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 16, 20, 16)
                      setBackgroundColor(Color.WHITE)
                  }

                  val icon = if (item.risk == "HIGH") "🔴"
                             else if (item.risk == "MEDIUM") "🟠" else "🟢"

                  row.addView(tv("$icon  ${item.name}", 17f, true))
                  row.addView(tv("${item.risk} RISK  •  ${item.details}", 13f))
                  resultsBox.addView(row)

                  row.startAnimation(AlphaAnimation(0f, 1f).apply { duration = 220 })
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirusShield-V2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
